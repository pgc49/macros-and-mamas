<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:'Karla',sans-serif;background:#FAF5F2;color:#33272E;display:flex;flex-direction:column}
.ph{height:600px;overflow:hidden;border-radius:0 0 170px 0}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.content{padding:48px 84px 66px;display:flex;flex-direction:column;flex:1}
.script{font-family:'Caveat',cursive;color:#B4416B;font-size:52px;line-height:1}

.strip{margin-top:auto;border-top:3px solid #ECDEE2;padding-top:32px}
.strip p{font-size:30px;line-height:1.42;color:#6E5D66;max-width:880px}
.strip p b{color:#33272E}
.ctarow{display:flex;align-items:center;gap:34px;margin-top:40px}
.cta{background:#B4416B;color:#FFF;font-weight:700;font-size:31px;border-radius:99px;padding:28px 48px;white-space:nowrap}
.deadline{font-size:26px;font-weight:700;color:#8E2F53}
.lockup{display:flex;align-items:center;gap:14px;margin-left:auto}
.lockup svg{width:52px;height:52px;border-radius:12px}
