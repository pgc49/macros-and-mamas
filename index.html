<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Cache-bust: Chrome often keeps the old Vite purple favicon until the URL changes -->
    <link rel="icon" href="/favicon.ico?v=6" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <!-- No query string on apple-touch-icon — iOS often ignores ?v= and falls back to the transparent favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v6.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#B4416B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Macros and Mamas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Macros and Mamas</title>
    <meta
      name="description"
      content="An 8-week macro program for moms — personalized ranges, real food, and Callie in your pocket all week."
    />

    <!-- Open Graph / iMessage / Instagram link previews (Meet Callie photo) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Macros and Mamas" />
    <meta property="og:title" content="Macros and Mamas" />
    <meta
      property="og:description"
      content="An 8-week macro program for moms — personalized ranges, real food, and Callie in your pocket all week."
    />
    <meta property="og:url" content="https://www.macrosandmamas.com/" />
    <meta property="og:image" content="https://www.macrosandmamas.com/og-image.jpg?v=1" />
    <meta property="og:image:secure_url" content="https://www.macrosandmamas.com/og-image.jpg?v=1" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Callie, founder of Macros and Mamas" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Macros and Mamas" />
    <meta
      name="twitter:description"
      content="An 8-week macro program for moms — personalized ranges, real food, and Callie in your pocket all week."
    />
    <meta name="twitter:image" content="https://www.macrosandmamas.com/og-image.jpg?v=1" />
  </head>
  <body>
    <style>
      /* Keep Home Screen PWA content above the iOS home indicator */
      html, body, #root {
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
      }
      body {
        margin: 0;
        padding: 0;
        background: #FBF7F2;
        color: #2B1C24;
        font-family: Georgia, "Times New Roman", serif;
      }
      /* Tab bar: match device home-indicator inset (fixed shell makes env() reliable).
         Floor at 16px when inset is 0; no hard 48px overshoot. */
      .mam-tabbar {
        padding-bottom: 16px;
        padding-bottom: max(16px, constant(safe-area-inset-bottom));
        padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
      }
      #mam-boot-loading, #mam-boot-fail {
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        display: grid;
        place-items: center;
        padding: 28px 22px;
        text-align: center;
        box-sizing: border-box;
      }
      #mam-boot-fail[hidden], #mam-boot-loading[hidden] { display: none !important; }
      #mam-boot-loading p, #mam-boot-fail p {
        max-width: 22rem;
        margin: 10px auto 0;
        line-height: 1.5;
        color: #5C4A52;
        font-size: 15px;
      }
      #mam-boot-fail a {
        color: #B4416B;
      }
      #mam-boot-fail button {
        margin-top: 18px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 15px;
        font-weight: 700;
        padding: 12px 18px;
        border-radius: 12px;
        border: 1.5px solid #B4416B;
        background: #B4416B;
        color: #fff;
        cursor: pointer;
      }
    </style>
    <div id="root">
      <div id="mam-boot-loading" role="status" aria-live="polite">
        <div>
          <div style="font-size: 1.35rem; letter-spacing: 0.02em;">Macros and Mamas</div>
          <p>Loading…</p>
        </div>
      </div>
      <div id="mam-boot-fail" hidden role="alert">
        <div>
          <div style="font-size: 1.35rem;">Couldn’t load the app</div>
          <p>Usually this is a brief glitch right after an update. Tap refresh — or force-close the home-screen icon and open it again.</p>
          <p id="mam-boot-fail-detail" style="font-size: 12px; color: #8A737C;"></p>
          <button type="button" onclick="location.reload()">Refresh</button>
          <p style="margin-top: 16px; font-size: 13px;"><a href="/support">Report a problem</a></p>
        </div>
      </div>
    </div>
    <!-- Inline early recovery: module script failures never reach React/Sentry. -->
    <script>
      (function () {
        var KEY = "mam-boot-reload";
        function marked() {
          try { return sessionStorage.getItem(KEY) === "1"; } catch (e) { return false; }
        }
        function mark() {
          try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
        }
        function fail(msg) {
          var el = document.getElementById("mam-boot-fail");
          var d = document.getElementById("mam-boot-fail-detail");
          var loading = document.getElementById("mam-boot-loading");
          if (d && msg) d.textContent = String(msg).slice(0, 240);
          if (el) el.hidden = false;
          if (loading) loading.hidden = true;
        }
        function reloadOnce(reason) {
          if (marked()) { fail(reason || ""); return; }
          mark();
          location.reload();
        }
        window.addEventListener("error", function (ev) {
          var t = ev && ev.target;
          if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
            reloadOnce("A required file failed to load.");
          }
        }, true);
        window.addEventListener("unhandledrejection", function (ev) {
          var r = ev && ev.reason;
          var msg = (r && (r.message || String(r))) || "";
          if (/Failed to fetch dynamically imported module|Loading chunk|error loading dynamically imported module|MIME type/i.test(msg)) {
            reloadOnce(msg);
          }
        });
        /* If the module never mounts, surface UI after 12s instead of endless blank. */
        window.setTimeout(function () {
          if (!window.__MAM_BOOTED__) {
            fail("The app took too long to start. Refresh, or check your connection.");
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
