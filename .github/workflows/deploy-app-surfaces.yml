name: Preview isolated app surface

on:
  workflow_dispatch:
    inputs:
      surface:
        type: choice
        options: [customer, admin]
        required: true

concurrency:
  group: app-surface-preview-${{ inputs.surface }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ vars.ENABLE_ISOLATED_SURFACE_PREVIEWS == 'true' }}
    runs-on: ubuntu-latest
    environment: app-surfaces-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:messaging
      - name: Validate required public build variables
        env:
          CUSTOMER_APP_URL: ${{ vars.CUSTOMER_APP_URL }}
          ADMIN_APP_URL: ${{ vars.ADMIN_APP_URL }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VAPID: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: |
          for name in CUSTOMER_APP_URL ADMIN_APP_URL SUPABASE_URL SUPABASE_ANON VAPID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository variable $name"
              exit 1
            fi
          done
      - run: npm run build:${{ inputs.surface }}
        env:
          CF_PAGES_BRANCH: preview-${{ github.run_id }}
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
          PREVIEW_MARKETING: ${{ inputs.surface == 'customer' && '1' || '0' }}
          CF_PAGES_URL: ${{ inputs.surface == 'customer' && vars.CUSTOMER_APP_URL || vars.ADMIN_APP_URL }}
          CUSTOMER_APP_URL: ${{ vars.CUSTOMER_APP_URL }}
          VITE_ADMIN_APP_URL: ${{ vars.ADMIN_APP_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_CF_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CF_WEB_ANALYTICS_TOKEN }}
          VITE_LIVE_CHANNEL_COHORTS: ${{ vars.VITE_LIVE_CHANNEL_COHORTS }}
      - run: npx wrangler@4.120.1 pages deploy dist --project-name "$PROJECT" --branch "$PREVIEW_BRANCH" --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ inputs.surface == 'customer' && vars.CUSTOMER_PAGES_PROJECT || vars.ADMIN_PAGES_PROJECT }}
          PREVIEW_BRANCH: preview-${{ github.run_id }}

