name: Preview isolated customer and admin surfaces

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: app-surface-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ vars.ENABLE_ISOLATED_SURFACE_PREVIEWS == 'true' }}
    runs-on: ubuntu-latest
    environment: app-surfaces-preview
    steps:
      - name: Validate staging isolation
        env:
          CUSTOMER_PROJECT: ${{ vars.CUSTOMER_PAGES_PROJECT }}
          ADMIN_PROJECT: ${{ vars.ADMIN_PAGES_PROJECT }}
          CUSTOMER_URL: ${{ vars.CUSTOMER_STAGING_URL }}
          ADMIN_URL: ${{ vars.ADMIN_STAGING_URL }}
          ADMIN_HOST: ${{ vars.ADMIN_STAGING_HOST }}
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ANON: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
          VAPID: ${{ vars.STAGING_VAPID_PUBLIC_KEY }}
        run: |
          for name in CUSTOMER_PROJECT ADMIN_PROJECT CUSTOMER_URL ADMIN_URL ADMIN_HOST SUPABASE_URL SUPABASE_REF SUPABASE_ANON VAPID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing staging variable $name"
              exit 1
            fi
          done
          test "$CUSTOMER_PROJECT" != "$ADMIN_PROJECT"
          test "$CUSTOMER_URL" != "$ADMIN_URL"
          node - <<'NODE'
          const prodRef = "reangkqbsazwxvrqvsdo";
          const ref = process.env.SUPABASE_REF;
          const urlRef = new URL(process.env.SUPABASE_URL).hostname.split(".")[0];
          if (ref === prodRef || urlRef === prodRef || ref !== urlRef) process.exit(1);
          if (new URL(process.env.CUSTOMER_URL).hostname === "www.macrosandmamas.com") process.exit(1);
          if (new URL(process.env.ADMIN_URL).hostname === "admin.macrosandmamas.com") process.exit(1);
          if (new URL(process.env.ADMIN_URL).hostname !== process.env.ADMIN_HOST) process.exit(1);
          NODE
      - name: Require green full integration CI for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/spa-quality.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            > /tmp/quality-runs.json
          node - <<'NODE'
          const runs = require("/tmp/quality-runs.json").workflow_runs || [];
          if (!runs.some((run) => run.head_sha === process.env.GITHUB_SHA && run.conclusion === "success")) {
            console.error("No successful full SPA quality run for this exact SHA");
            process.exit(1);
          }
          NODE

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: app-surfaces-preview
    strategy:
      matrix:
        surface: [admin, customer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:messaging
      - run: npm run build:${{ matrix.surface }}
        env:
          CF_PAGES_BRANCH: staging
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
          PREVIEW_MARKETING: ${{ matrix.surface == 'customer' && '1' || '0' }}
          CF_PAGES_URL: ${{ matrix.surface == 'customer' && vars.CUSTOMER_STAGING_URL || vars.ADMIN_STAGING_URL }}
          CUSTOMER_APP_URL: ${{ vars.CUSTOMER_STAGING_URL }}
          ADMIN_APP_ALLOWED_HOSTS: ${{ vars.ADMIN_STAGING_HOST }}
          VITE_ADMIN_APP_URL: ${{ vars.ADMIN_STAGING_URL }}
          VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.STAGING_VAPID_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ vars.STAGING_SENTRY_DSN }}
          VITE_LIVE_CHANNEL_COHORTS: ${{ vars.VITE_LIVE_CHANNEL_COHORTS }}
      - run: npx wrangler@4.120.1 pages functions build functions
      - run: npx wrangler@4.120.1 pages deploy dist --project-name "$PROJECT" --branch staging --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ matrix.surface == 'customer' && vars.CUSTOMER_PAGES_PROJECT || vars.ADMIN_PAGES_PROJECT }}

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    environment: app-surfaces-preview
    steps:
      - name: Verify staging runtime identity and recovery ownership
        env:
          CUSTOMER_URL: ${{ vars.CUSTOMER_STAGING_URL }}
          ADMIN_URL: ${{ vars.ADMIN_STAGING_URL }}
          SUPABASE_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
        run: |
          set -euo pipefail
          for pair in "customer:$CUSTOMER_URL" "admin:$ADMIN_URL"; do
            surface=${pair%%:*}
            base=${pair#*:}
            manifest=$(curl -fsS "$base/surface-manifest.json")
            node -e '
              const value = JSON.parse(process.argv[1]);
              if (value.surface !== process.argv[2]) process.exit(1);
              if (value.buildId !== process.env.GITHUB_SHA) process.exit(1);
              if (value.supabaseProjectRef !== process.env.SUPABASE_REF) process.exit(1);
            ' "$manifest" "$surface"
            payload=$(curl -fsS "$base/api/environment-check")
            echo "$payload"
            node -e '
              const value = JSON.parse(process.argv[1]);
              if (value.environment !== "staging") process.exit(1);
              if (value.supabaseProjectRef !== process.env.SUPABASE_REF) process.exit(1);
              if (value.messagingSchemaVersion !== "admin_dm_v1") process.exit(1);
              if (value.adminAppUrl !== process.env.ADMIN_URL) process.exit(1);
            ' "$payload"
          done
          curl -fsS -X POST "$CUSTOMER_URL/api/staging-messaging-fixtures" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"action":"seed"}' > /tmp/staging-fixture.json
          cat /tmp/staging-fixture.json

          curl -fsS -X POST "$CUSTOMER_URL/api/message-outbox-cron" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" > /tmp/outbox.json
          curl -fsS -X POST "$CUSTOMER_URL/api/message-attachment-gc-cron" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"graceMinutes":0}' > /tmp/gc.json

          node - <<'NODE' > /tmp/verify-body.json
          const fixture = require("/tmp/staging-fixture.json");
          process.stdout.write(JSON.stringify({
            action: "verify",
            messageId: fixture.messageId,
            objectPath: fixture.objectPath,
          }));
          NODE
          curl -fsS -X POST "$CUSTOMER_URL/api/staging-messaging-fixtures" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data @/tmp/verify-body.json > /tmp/fixture-verify.json
          cat /tmp/fixture-verify.json

          curl -fsS -X POST "$CUSTOMER_URL/api/messaging-health" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" > /tmp/health.json
          node -e '
            const value = require("/tmp/health.json");
            if (!value.ok || value.outbox.dead > 0 || value.outbox.staleProcessing > 0) process.exit(1);
          '

