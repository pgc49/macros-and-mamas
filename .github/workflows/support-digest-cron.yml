# Daily triage of App help / feedback GitHub issues.
# AI comments a plan; emails Patrick only when needs-approval.
# Does not open agents or edit the codebase.
# Requires GitHub Actions secret CRON_SECRET (same as Cloudflare Pages).

name: Support feedback triage

on:
  schedule:
    # 13:30 UTC ≈ morning US Eastern
    - cron: "30 13 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Require CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add GitHub Actions secret CRON_SECRET (match Cloudflare Pages CRON_SECRET)."
            exit 1
          fi

      - name: Trigger support-digest-cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          resp=$(curl -sS -o /tmp/cron-out.json -w "%{http_code}" -X POST \
            "https://www.macrosandmamas.com/api/support-digest-cron" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP $resp"
          cat /tmp/cron-out.json
          test "$resp" = "200"
