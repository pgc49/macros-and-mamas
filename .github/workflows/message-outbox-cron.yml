name: Message notification outbox

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add CRON_SECRET (same value as Cloudflare Pages)."
            exit 1
          fi

      - name: Retry pending message notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/outbox.json -w "%{http_code}" -X POST \
            "https://www.macrosandmamas.com/api/message-outbox-cron" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          cat /tmp/outbox.json
          test "$status" = "200"

