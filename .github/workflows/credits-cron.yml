# Vest pending mama credits + mirror available balance to Stripe Customer Balance.
# Uses the same CRON_SECRET as Lifecycle email cron.

name: Credits vest cron

on:
  schedule:
    - cron: "45 * * * *" # hourly at :45 UTC (offset from email-cron :15)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Require CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add GitHub Actions secret CRON_SECRET (match Cloudflare Pages CRON_SECRET)."
            exit 1
          fi

      - name: Trigger credits-cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          resp=$(curl -sS -o /tmp/cron-out.json -w "%{http_code}" -X POST \
            "https://www.macrosandmamas.com/api/credits-cron" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP $resp"
          cat /tmp/cron-out.json
          test "$resp" = "200"
