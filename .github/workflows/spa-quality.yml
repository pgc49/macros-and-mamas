name: SPA quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spa-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Messaging checks
        run: npm run qa:messaging

      - name: Production build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Prepare isolated messaging schema
        run: |
          DB_ROOT="$RUNNER_TEMP/messaging-db"
          mkdir -p "$DB_ROOT"
          supabase init --workdir "$DB_ROOT"
          python - "$DB_ROOT/supabase/config.toml" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          marker = "[db.seed]"
          before, after = text.split(marker, 1)
          after = after.replace("enabled = true", "enabled = false", 1)
          path.write_text(before + marker + after)
          PY
          mkdir -p "$DB_ROOT/supabase/migrations" "$DB_ROOT/supabase/tests"
          cp supabase/tests/bootstrap_messaging.sql \
            "$DB_ROOT/supabase/migrations/20260101000000_bootstrap_messaging.sql"
          cp supabase/migrations/20260811014815_messaging_inbox_and_ordering.sql \
            "$DB_ROOT/supabase/migrations/"
          if [ -f supabase/migrations/20260811022913_messaging_idempotency_outbox.sql ]; then
            cp supabase/migrations/20260811022913_messaging_idempotency_outbox.sql \
              "$DB_ROOT/supabase/migrations/"
          fi
          cp supabase/tests/messaging_inbox.sql "$DB_ROOT/supabase/tests/"
          if [ -f supabase/tests/messaging_idempotency_outbox.sql ]; then
            cp supabase/tests/messaging_idempotency_outbox.sql "$DB_ROOT/supabase/tests/"
          fi
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"

      - name: Start disposable Supabase
        run: supabase start --workdir "$DB_ROOT"

      - name: Messaging database and RLS tests
        run: supabase test db "$DB_ROOT/supabase/tests" --workdir "$DB_ROOT"

  admin-dm-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Prepare legacy-shaped admin DM database
        run: |
          DB_ROOT="$RUNNER_TEMP/admin-dm-db"
          mkdir -p "$DB_ROOT"
          supabase init --workdir "$DB_ROOT"
          python - "$DB_ROOT/supabase/config.toml" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          marker = "[db.seed]"
          before, after = text.split(marker, 1)
          after = after.replace("enabled = true", "enabled = false", 1)
          path.write_text(before + marker + after)
          PY
          mkdir -p "$DB_ROOT/supabase/migrations" "$DB_ROOT/supabase/tests"
          cp supabase/tests/bootstrap_messaging.sql \
            "$DB_ROOT/supabase/migrations/20260101000000_bootstrap_messaging.sql"
          cp supabase/migrations/20260811014815_messaging_inbox_and_ordering.sql \
            "$DB_ROOT/supabase/migrations/"
          cp supabase/migrations/20260811022913_messaging_idempotency_outbox.sql \
            "$DB_ROOT/supabase/migrations/"
          cp supabase/tests/seed_admin_dm_legacy.sql \
            "$DB_ROOT/supabase/migrations/20260811120000_seed_admin_dm_legacy.sql"
          cp supabase/migrations/20260811132341_admin_dm_conversations.sql \
            "$DB_ROOT/supabase/migrations/"
          cp supabase/tests/admin_dm_conversations.sql "$DB_ROOT/supabase/tests/"
          echo "ADMIN_DM_DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - run: supabase start --workdir "$ADMIN_DM_DB_ROOT"
      - run: supabase test db "$ADMIN_DM_DB_ROOT/supabase/tests/admin_dm_conversations.sql" --workdir "$ADMIN_DM_DB_ROOT"
      - name: Admin DM Storage/RLS behavior
        run: |
          supabase status -o env --workdir "$ADMIN_DM_DB_ROOT" > "$RUNNER_TEMP/admin-dm.env"
          set -a
          source "$RUNNER_TEMP/admin-dm.env"
          set +a
          node scripts/qa-admin-dm-storage.mjs
