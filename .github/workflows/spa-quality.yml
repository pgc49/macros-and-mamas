name: SPA quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spa-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Messaging checks
        run: npm run qa:messaging

      - name: Production build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Prepare isolated messaging schema
        run: |
          DB_ROOT="$RUNNER_TEMP/messaging-db"
          mkdir -p "$DB_ROOT"
          supabase init --workdir "$DB_ROOT"
          python - "$DB_ROOT/supabase/config.toml" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          marker = "[db.seed]"
          before, after = text.split(marker, 1)
          after = after.replace("enabled = true", "enabled = false", 1)
          path.write_text(before + marker + after)
          PY
          mkdir -p "$DB_ROOT/supabase/migrations" "$DB_ROOT/supabase/tests"
          cp supabase/tests/bootstrap_messaging.sql \
            "$DB_ROOT/supabase/migrations/20260101000000_bootstrap_messaging.sql"
          cp supabase/migrations/20260811014815_messaging_inbox_and_ordering.sql \
            "$DB_ROOT/supabase/migrations/"
          if [ -f supabase/migrations/20260811022913_messaging_idempotency_outbox.sql ]; then
            cp supabase/migrations/20260811022913_messaging_idempotency_outbox.sql \
              "$DB_ROOT/supabase/migrations/"
          fi
          if [ -f supabase/migrations/20260811064316_push_subscription_origin.sql ]; then
            cp supabase/migrations/20260811064316_push_subscription_origin.sql \
              "$DB_ROOT/supabase/migrations/"
          fi
          cp supabase/tests/messaging_inbox.sql "$DB_ROOT/supabase/tests/"
          if [ -f supabase/tests/messaging_idempotency_outbox.sql ]; then
            cp supabase/tests/messaging_idempotency_outbox.sql "$DB_ROOT/supabase/tests/"
          fi
          if [ -f supabase/tests/push_subscription_origin.sql ]; then
            cp supabase/tests/push_subscription_origin.sql "$DB_ROOT/supabase/tests/"
          fi
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"

      - name: Start disposable Supabase
        run: supabase start --workdir "$DB_ROOT"

      - name: Messaging database and RLS tests
        run: supabase test db "$DB_ROOT/supabase/tests" --workdir "$DB_ROOT"

  surface-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        surface: [customer, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:${{ matrix.surface }}
        env:
          CF_PAGES_BRANCH: main
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
          CF_PAGES_URL: ${{ matrix.surface == 'customer' && vars.CUSTOMER_APP_URL || vars.ADMIN_APP_URL }}
          CUSTOMER_APP_URL: ${{ vars.CUSTOMER_APP_URL }}
          VITE_ADMIN_APP_URL: ${{ vars.ADMIN_APP_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_CF_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CF_WEB_ANALYTICS_TOKEN }}
          VITE_LIVE_CHANNEL_COHORTS: ${{ vars.VITE_LIVE_CHANNEL_COHORTS }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.surface }}-surface-${{ github.sha }}
          path: dist
          retention-days: 7

  classify-production-surfaces:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_ISOLATED_SURFACE_DEPLOYS == 'true' }}
    needs: [verify, database, surface-build]
    runs-on: ubuntu-latest
    outputs:
      customer: ${{ steps.paths.outputs.customer }}
      admin: ${{ steps.paths.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || printf '%s' "$BEFORE" | rg -q '^0+$'; then
            echo "customer=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BEFORE" "$GITHUB_SHA" > /tmp/changed.txt
          # Admin currently contains the full app, so every runtime/shared
          # change deploys admin. Documentation-only commits do not.
          if rg -q '^(src/|functions/|public/|scripts/|supabase/|index\\.html$|package|vite\\.config)' /tmp/changed.txt; then
            echo "admin=true" >> "$GITHUB_OUTPUT"
          else
            echo "admin=false" >> "$GITHUB_OUTPUT"
          fi
          # Customer-neutral means every file is explicitly admin-only.
          if awk '
            !(/^src\\/admin\\// || /^docs\\/ADMIN-CUSTOMER-DEPLOYMENT-ISOLATION\\.md$/) { shared=1 }
            END { exit shared ? 0 : 1 }
          ' /tmp/changed.txt; then
            echo "customer=true" >> "$GITHUB_OUTPUT"
          else
            echo "customer=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-customer-production:
    needs: [surface-build, classify-production-surfaces]
    if: ${{ needs.classify-production-surfaces.outputs.customer == 'true' }}
    runs-on: ubuntu-latest
    environment: app-surfaces-production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: customer-surface-${{ github.sha }}
          path: dist
      - run: npx wrangler@4.120.1 pages deploy dist --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CUSTOMER_PAGES_PROJECT }}

  deploy-admin-production:
    needs: [surface-build, classify-production-surfaces]
    if: ${{ needs.classify-production-surfaces.outputs.admin == 'true' }}
    runs-on: ubuntu-latest
    environment: app-surfaces-production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: admin-surface-${{ github.sha }}
          path: dist
      - run: npx wrangler@4.120.1 pages deploy dist --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.ADMIN_PAGES_PROJECT }}
