# Cloudflare Pages project for the marketing site (separate from the product SPA).
name = "macrosandmamas-marketing"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

# Plaintext vars are managed here (CF dashboard secrets-only when wrangler.toml is present).
# Flip enrollment CTAs: "open" | "waitlist" — then merge to main / redeploy.
[vars]
PUBLIC_ENROLLMENT_MODE = "waitlist"
PUBLIC_META_PIXEL_ID = "1078367721716098"
META_PIXEL_ID = "1078367721716098"
